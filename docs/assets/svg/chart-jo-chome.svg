<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="cjc-t cjc-d" font-family="'Noto Sans KR','Noto Sans JP',sans-serif" lang="ko">
<title id="cjc-t">삿포로 주소 읽기</title>
<desc id="cjc-d">삿포로 바둑판 주소 읽기 개념도. 가로는 丁目(초메): 創成川(소세이가와) 서쪽이 西(니시), 동쪽이 東(히가시)이고 멀어질수록 숫자가 커진다. 세로는 条(조): 大通公園(오도리 공원) 북쪽이 北(기타), 남쪽이 南(미나미)이고 멀어질수록 숫자가 커진다. 예: 숙소 由縁 札幌(유엔 삿포로)는 北1西7(기타 1 니시 7), 魚菜(교사이)는 南3西5(미나미 3 니시 5), 桜本(사쿠라모토)는 南10西7(미나미 10 니시 7), 鷄灯(게이토)는 南1東2(미나미 1 히가시 2). 근거: 国土地理院 주소 검색으로 얻은 블록 대표점 배치.</desc>
