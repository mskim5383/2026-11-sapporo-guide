<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-labelledby="csm-t csm-d" font-family="'Noto Sans KR','Noto Sans JP',sans-serif" lang="ko">
<title id="csm-t">홋카이도 주미</title>
<desc id="csm-d">홋카이도 주미 연표. 吟風(긴푸) 2000 우량품종, 대립·저단백, 国稀(구니마레)·金滴(긴테키)·北の勝(기타노카쓰)·男山(오토코야마)·五稜(고료). 彗星(스이세이) 2006 우량품종, 단백질이 낮아 담려, 내냉성, 三千櫻(미치자쿠라)·五稜·二世古(니세코)·国士無双(고쿠시무소). きたしずく(기타시즈쿠) 2012 품종 등록·2014-02 우량품종, 교배 雄町(오마치)/ほしのゆめ(호시노유메)//吟風(긴푸), 千歳鶴(지토세쓰루) 사케 뮤지엄 한정 생주·北の勝·三千櫻. 北冴(기타사에) 시험 품종, 上川大雪(가미카와 다이세쓰) 2025-03. 공통 과제: 천립중이 가볍고 단백질이 높다.</desc>
<rect width="1000" height="650" fill="#ffffff"/>
<rect x="30" y="12" width="455" height="290" rx="6" fill="#ffffff" stroke="#1f4a3f" stroke-width="2.5"/>
<circle cx="70" cy="54" r="20" fill="none" stroke="#1f4a3f" stroke-width="3"/><circle cx="70" cy="54" r="9" fill="#1f4a3f"/>
<text x="104" y="62" font-size="32" font-weight="700" fill="#1f4a3f" lang="ja" font-family="'Noto Serif JP','Noto Serif KR',serif">吟風</text>
<text x="180" y="62" font-size="26" font-weight="700" fill="#1f4a3f">(긴푸)</text>
<text x="50" y="100" font-size="24" font-weight="700" fill="#16191d">2000 우량품종</text>
<text x="50" y="132" font-size="24" fill="#16191d">대립·저단백. 도산 쌀</text>
<text x="50" y="160" font-size="24" fill="#16191d">니혼슈가 퍼진 계기</text>
<text x="50" y="194" font-size="24" font-weight="700" fill="#4a5058">쓰는 곳 예</text>
<text x="50" y="222" font-size="24" fill="#2b3036"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">国稀</tspan>(구니마레)·<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">金滴</tspan>(긴테키)</text>
<text x="50" y="250" font-size="24" fill="#2b3036"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">北の勝</tspan>(기타노카쓰)·<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">男山</tspan></text>
<text x="50" y="278" font-size="24" fill="#2b3036">(오토코야마)·<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">五稜</tspan>(고료)</text>
<rect x="515" y="12" width="455" height="290" rx="6" fill="#ffffff" stroke="#1f4a3f" stroke-width="2.5"/>
<circle cx="555" cy="54" r="20" fill="none" stroke="#1f4a3f" stroke-width="3"/><circle cx="555" cy="54" r="9" fill="#1f4a3f"/>
<text x="589" y="62" font-size="32" font-weight="700" fill="#1f4a3f" lang="ja" font-family="'Noto Serif JP','Noto Serif KR',serif">彗星</text>
<text x="665" y="62" font-size="26" font-weight="700" fill="#1f4a3f">(스이세이)</text>
<text x="535" y="100" font-size="24" font-weight="700" fill="#16191d">2006 우량품종</text>
<text x="535" y="132" font-size="24" fill="#16191d">단백질이 낮아 담려.</text>
<text x="535" y="160" font-size="24" fill="#16191d">내냉성, 대립·다수확</text>
<text x="535" y="194" font-size="24" font-weight="700" fill="#4a5058">쓰는 곳 예</text>
<text x="535" y="222" font-size="24" fill="#2b3036"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">三千櫻</tspan>(미치자쿠라)·<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">五稜</tspan>(고료)</text>
<text x="535" y="250" font-size="24" fill="#2b3036"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">二世古</tspan>(니세코)</text>
<text x="535" y="278" font-size="24" fill="#2b3036"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">国士無双</tspan>(고쿠시무소)</text>
<rect x="30" y="318" width="455" height="290" rx="6" fill="#ffffff" stroke="#1f4a3f" stroke-width="2.5"/>
<circle cx="70" cy="360" r="20" fill="none" stroke="#1f4a3f" stroke-width="3"/><circle cx="70" cy="360" r="9" fill="#1f4a3f"/>
<text x="104" y="368" font-size="32" font-weight="700" fill="#1f4a3f" lang="ja" font-family="'Noto Serif JP','Noto Serif KR',serif">きたしずく</text>
<text x="276" y="368" font-size="26" font-weight="700" fill="#1f4a3f">(기타시즈쿠)</text>
<text x="50" y="406" font-size="24" font-weight="700" fill="#16191d">2012 등록 · 2014-02 우량품종</text>
<text x="50" y="438" font-size="24" fill="#16191d"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">雄町</tspan>(오마치)/<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">ほしのゆめ</tspan></text>
<text x="50" y="466" font-size="24" fill="#16191d">(호시노유메)//<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">吟風</tspan>(긴푸)</text>
<text x="50" y="500" font-size="24" font-weight="700" fill="#4a5058">쓰는 곳 예</text>
<text x="50" y="528" font-size="24" fill="#2b3036"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">千歳鶴</tspan>(지토세쓰루) 뮤지엄 한정 생주</text>
<text x="50" y="556" font-size="24" fill="#2b3036"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">北の勝</tspan>(기타노카쓰)·<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">三千櫻</tspan></text>
<text x="50" y="584" font-size="24" fill="#2b3036">(미치자쿠라)</text>
<rect x="515" y="318" width="455" height="290" rx="6" fill="#ffffff" stroke="#1f4a3f" stroke-width="2.5"/>
<circle cx="555" cy="360" r="20" fill="none" stroke="#1f4a3f" stroke-width="3"/><circle cx="555" cy="360" r="9" fill="#1f4a3f"/>
<text x="589" y="368" font-size="32" font-weight="700" fill="#1f4a3f" lang="ja" font-family="'Noto Serif JP','Noto Serif KR',serif">北冴</text>
<text x="665" y="368" font-size="26" font-weight="700" fill="#1f4a3f">(기타사에)</text>
<text x="535" y="406" font-size="24" font-weight="700" fill="#16191d">시험 품종</text>
<text x="535" y="438" font-size="24" fill="#16191d">차세대 후보</text>
<text x="535" y="472" font-size="24" font-weight="700" fill="#4a5058">쓰는 곳 예</text>
<text x="535" y="500" font-size="24" fill="#2b3036"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">上川大雪</tspan>(가미카와 다이세쓰)</text>
<text x="535" y="528" font-size="24" fill="#2b3036">2025-03 「<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">北海道産</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">北冴</tspan>」</text>
<text x="535" y="556" font-size="24" fill="#2b3036">(홋카이도산 기타사에)</text>
<text x="30" y="638" font-size="24" fill="#4a5058">공통 과제: 품종이 나아져도 천립중이 가볍고 단백질이 높은 편(연구 요약).</text>
</svg>
