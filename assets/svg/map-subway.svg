<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-labelledby="msub-t msub-d" font-family="'Noto Sans KR','Noto Sans JP',sans-serif" lang="ko">
<title id="msub-t">이번 일정에 쓰는 지하철·JR·시전</title>
<desc id="msub-d">삿포로 지하철·JR·시전 개념도(이번 일정에 쓰는 역만). 南北線(난보쿠선): 北24条(기타니주욘조, D3 鍾馗(쇼키)) – さっぽろ(삿포로) – 大通(오도리) – すすきの(스스키노) – 中島公園(나카지마코엔, D2) – 지나는 역 4곳 – 澄川(스미카와, D2 木多郎(기타로)). 大通에서 北24条까지 약 7분, さっぽろ에서 澄川까지 약 16분. 東西線(도자이선): 西11丁目(니시주잇초메) – 大通(오도리) – バスセンター前(바스센타마에). JR: 札幌(삿포로) – 苗穂(나에보, D3 아리오), 札幌 – 新千歳空港(신치토세 공항) 快速エアポート(쾌속 에어포트) 37분(D1·D4). 市電(시전): 西4丁目(니시욘초메) – 狸小路(다누키코지) – すすきの(스스키노) – 資生館小学校前(시세이칸쇼각코마에) – 東本願寺前(히가시혼간지마에) – 山鼻9条(야마하나 9조) – 中島公園通(나카지마코엔도리, D2 桜本(사쿠라모토)). 갈아타기: さっぽろ↔JR 札幌, 大通↔西4丁目, すすきの 지하철↔시전.</desc>
