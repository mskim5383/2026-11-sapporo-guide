<text x="30" y="38" font-size="28" font-weight="700" fill="#6b1d33"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">얼마나</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">사면</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">얼마</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">만원</tspan>, <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">추정</tspan>)</text>
