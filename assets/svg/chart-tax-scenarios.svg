<text x="30" y="600" font-size="24" fill="#4a5058"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">범위</tspan>: <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">면세</tspan> 4<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">병에</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">어느</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">병이</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">들어가느냐에</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">따라</tspan>. <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">가정</tspan> 1<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">엔</tspan> = 9.3<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">원</tspan>, <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">단가는</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">가정값</tspan>.</text>
