<text x="78" y="412" font-size="24" font-weight="700" fill="#16191d"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">와인</tspan> 12 + <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">사케</tspan> 6</text>
<text x="78" y="442" font-size="24" fill="#2b3036"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">술</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">무게</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">약</tspan> 26.4kg</text>
<text x="78" y="472" font-size="24" fill="#2b3036"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">구매가</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">약</tspan> 110<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">만원</tspan></text>
