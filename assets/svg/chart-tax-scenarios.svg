<rect x="725.6" y="432" width="100.8" height="30" rx="4" fill="#ffffff" stroke="#b3261e" stroke-width="3"/>
<text x="836.4" y="456" font-size="24" font-weight="700" fill="#b3261e" stroke="#ffffff" stroke-width="6.7" stroke-linejoin="round" paint-order="stroke"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">미신고</tspan> 76~94</text>
