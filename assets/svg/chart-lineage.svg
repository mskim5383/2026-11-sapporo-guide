<text x="30" y="676" font-size="24" fill="#2b3036"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">余市</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">요이치</tspan>) <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">이주자</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">다수가</tspan> Takahiko <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">에서</tspan> 2<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">년</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">연수</tspan>(LOWBROW <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">는</tspan> 3<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">년</tspan>).</text>
<text x="30" y="708" font-size="24" fill="#4a5058">Takahiko <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">창업은</tspan> 2009 <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">또는</tspan> 2010(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">출처마다</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">다름</tspan>). <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">연도는</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">출처에</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">있는</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">것만</tspan>.</text>
