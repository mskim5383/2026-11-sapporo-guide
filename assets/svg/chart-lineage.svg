<text x="500" y="366" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">空知</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">소라치</tspan>)</text>
<text x="500" y="394" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">三笠</tspan>·<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">岩見沢</tspan></text>
<text x="500" y="422" font-size="24" fill="#16191d" text-anchor="middle">(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">미카사</tspan>·<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">이와미자와</tspan>)</text>
<rect x="670" y="300" width="300" height="150" rx="6" fill="#f6ecee" stroke="#6b1d33" stroke-width="2.5"/>
<text x="820" y="334" font-size="26" font-weight="700" fill="#6b1d33" text-anchor="middle">Nakazawa Vineyard</text>
<text x="820" y="366" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">空知</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">소라치</tspan>)</text>
<text x="820" y="394" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">岩見沢</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">栗沢</tspan></text>
<text x="820" y="422" font-size="24" fill="#16191d" text-anchor="middle">(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">이와미자와</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">구리사와</tspan>)</text>
<line x1="180" y1="450" x2="180" y2="514" stroke="#6b1d33" stroke-width="3" stroke-linecap="round"/>
<text x="196" y="500" font-size="24" font-weight="700" fill="#6b1d33">2<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">년</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">연수</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">뒤</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">독립한</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">余市</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">요이치</tspan>)<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">의</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">도멘</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">일부</tspan>)</text>
<rect x="30" y="514" width="178" height="116" rx="6" fill="#ffffff" stroke="#6b1d33" stroke-width="2.5"/>
<text x="119" y="550" font-size="24" font-weight="700" fill="#16191d" text-anchor="middle">Domaine Mon</text>
<text x="119" y="580" font-size="24" fill="#2b3036" text-anchor="middle">2016 <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">독립</tspan></text>
<rect x="218" y="514" width="178" height="116" rx="6" fill="#ffffff" stroke="#6b1d33" stroke-width="2.5"/>
