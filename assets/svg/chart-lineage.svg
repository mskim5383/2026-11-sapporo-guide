<line x1="500" y1="268" x2="500" y2="296" stroke="#6b1d33" stroke-width="3" stroke-linecap="round"/><path d="M500 296 L507.7 282 L492.3 282 Z" fill="#6b1d33"/>
<line x1="820" y1="268" x2="820" y2="296" stroke="#6b1d33" stroke-width="3" stroke-linecap="round"/><path d="M820 296 L827.7 282 L812.3 282 Z" fill="#6b1d33"/>
<text x="500" y="258" font-size="24" font-weight="700" fill="#6b1d33" text-anchor="middle" stroke="#ffffff" stroke-width="6.7" stroke-linejoin="round" paint-order="stroke"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">영향을</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">받은</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">생산자</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">サライ</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">사라이</tspan>) 2018)</text>
<rect x="30" y="300" width="300" height="150" rx="6" fill="#f6ecee" stroke="#6b1d33" stroke-width="2.5"/>
<text x="180" y="334" font-size="26" font-weight="700" fill="#6b1d33" text-anchor="middle">Domaine Takahiko</text>
<text x="180" y="366" font-size="24" fill="#16191d" text-anchor="middle" lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">曽我貴彦</text>
<text x="180" y="394" font-size="24" fill="#16191d" text-anchor="middle">(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">소가</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">다카히코</tspan>)</text>
<text x="180" y="422" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">余市</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">登</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">요이치</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">노보리</tspan>)</text>
