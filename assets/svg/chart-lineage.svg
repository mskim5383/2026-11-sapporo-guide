<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-labelledby="clin-t clin-d" font-family="'Noto Sans KR','Noto Sans JP',sans-serif" lang="ko">
<title id="clin-t">홋카이도 내추럴 와인의 계보</title>
<desc id="clin-d">홋카이도 내추럴 와인의 계보. Bruce Gutlove: 1989 栃木(도치기) ココ・ファーム(코코 팜) 초청으로 첫 방일, 1991 甲州(고슈)를 야생효모만으로 발효(무여과·무아황산), 2009 岩見沢(이와미자와) 이주, 2012 10R 설립(일본 첫 커스텀 크러시). サライ(사라이) 2018 이 꼽은 영향받은 생산자: Domaine Takahiko(曽我貴彦 소가 다카히코), KONDO, Nakazawa. Domaine Takahiko 에서 2년 연수 뒤 독립: Domaine Mon(2016), Atsushi Suzuki, LOWBROW(2022, 연수 3년), 山田堂(야마다도, 2021), ランセッカ(란세카, 2020).</desc>
<rect width="1000" height="720" fill="#ffffff"/>
<text x="30" y="40" font-size="28" font-weight="700" fill="#6b1d33">Bruce Gutlove(10R)</text>
<text x="330" y="40" font-size="24" fill="#2b3036">1961 뉴욕 롱아일랜드 출생, UC Davis 대학원 양조학</text>
<line x1="60" y1="98" x2="960" y2="98" stroke="#b9bec5" stroke-width="3" stroke-linecap="round"/>
<circle cx="110" cy="98" r="11" fill="#6b1d33" stroke="#fff" stroke-width="3"/>
<text x="110" y="76" font-size="28" font-weight="700" fill="#16191d" text-anchor="middle" font-family="'Noto Serif KR','Noto Serif JP',serif">1989</text>
<text x="110" y="140" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">栃木</tspan>(도치기)</text>
<text x="110" y="168" font-size="24" fill="#16191d" text-anchor="middle" lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">ココ・ファーム</text>
<text x="110" y="196" font-size="24" fill="#16191d" text-anchor="middle">(코코 팜) 초청,</text>
<text x="110" y="224" font-size="24" fill="#16191d" text-anchor="middle">첫 방일</text>
<circle cx="350" cy="98" r="11" fill="#6b1d33" stroke="#fff" stroke-width="3"/>
<text x="350" y="76" font-size="28" font-weight="700" fill="#16191d" text-anchor="middle" font-family="'Noto Serif KR','Noto Serif JP',serif">1991</text>
<text x="350" y="140" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">甲州</tspan>(고슈)를</text>
<text x="350" y="168" font-size="24" fill="#16191d" text-anchor="middle">야생효모만으로</text>
<text x="350" y="196" font-size="24" fill="#16191d" text-anchor="middle">발효. 무여과·</text>
<text x="350" y="224" font-size="24" fill="#16191d" text-anchor="middle">무아황산</text>
<circle cx="600" cy="98" r="11" fill="#6b1d33" stroke="#fff" stroke-width="3"/>
<text x="600" y="76" font-size="28" font-weight="700" fill="#16191d" text-anchor="middle" font-family="'Noto Serif KR','Noto Serif JP',serif">2009</text>
<text x="600" y="140" font-size="24" fill="#16191d" text-anchor="middle" lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">岩見沢</text>
<text x="600" y="168" font-size="24" fill="#16191d" text-anchor="middle">(이와미자와)로</text>
<text x="600" y="196" font-size="24" fill="#16191d" text-anchor="middle">이주</text>
<circle cx="850" cy="98" r="11" fill="#6b1d33" stroke="#fff" stroke-width="3"/>
<text x="850" y="76" font-size="28" font-weight="700" fill="#16191d" text-anchor="middle" font-family="'Noto Serif KR','Noto Serif JP',serif">2012</text>
<text x="850" y="140" font-size="24" fill="#16191d" text-anchor="middle">10R 설립.</text>
<text x="850" y="168" font-size="24" fill="#16191d" text-anchor="middle">일본 첫 커스텀</text>
<text x="850" y="196" font-size="24" fill="#16191d" text-anchor="middle">크러시(위탁 양조)</text>
<path d="M330 98 L316 90.3 L316 105.7 Z" fill="#b9bec5"/>
<path d="M580 98 L566 90.3 L566 105.7 Z" fill="#b9bec5"/>
<path d="M830 98 L816 90.3 L816 105.7 Z" fill="#b9bec5"/>
<line x1="850" y1="250" x2="850" y2="262" stroke="#6b1d33" stroke-width="4" stroke-linecap="round"/><path d="M850 262 L858.8 246 L841.2 246 Z" fill="#6b1d33"/>
<line x1="180" y1="268" x2="850" y2="268" stroke="#6b1d33" stroke-width="3" stroke-linecap="round"/>
<line x1="180" y1="268" x2="180" y2="296" stroke="#6b1d33" stroke-width="3" stroke-linecap="round"/><path d="M180 296 L187.7 282 L172.3 282 Z" fill="#6b1d33"/>
<line x1="500" y1="268" x2="500" y2="296" stroke="#6b1d33" stroke-width="3" stroke-linecap="round"/><path d="M500 296 L507.7 282 L492.3 282 Z" fill="#6b1d33"/>
<line x1="820" y1="268" x2="820" y2="296" stroke="#6b1d33" stroke-width="3" stroke-linecap="round"/><path d="M820 296 L827.7 282 L812.3 282 Z" fill="#6b1d33"/>
<text x="500" y="258" font-size="24" font-weight="700" fill="#6b1d33" text-anchor="middle" stroke="#ffffff" stroke-width="6.7" stroke-linejoin="round" paint-order="stroke">영향을 받은 생산자(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">サライ</tspan>(사라이) 2018)</text>
<rect x="30" y="300" width="300" height="150" rx="6" fill="#f6ecee" stroke="#6b1d33" stroke-width="2.5"/>
<text x="180" y="334" font-size="26" font-weight="700" fill="#6b1d33" text-anchor="middle">Domaine Takahiko</text>
<text x="180" y="366" font-size="24" fill="#16191d" text-anchor="middle" lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">曽我貴彦</text>
<text x="180" y="394" font-size="24" fill="#16191d" text-anchor="middle">(소가 다카히코)</text>
<text x="180" y="422" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">余市</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">登</tspan>(요이치 노보리)</text>
<rect x="350" y="300" width="300" height="150" rx="6" fill="#f6ecee" stroke="#6b1d33" stroke-width="2.5"/>
<text x="500" y="334" font-size="26" font-weight="700" fill="#6b1d33" text-anchor="middle">KONDO Vineyard</text>
<text x="500" y="366" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">空知</tspan>(소라치)</text>
<text x="500" y="394" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">三笠</tspan>·<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">岩見沢</tspan></text>
<text x="500" y="422" font-size="24" fill="#16191d" text-anchor="middle">(미카사·이와미자와)</text>
<rect x="670" y="300" width="300" height="150" rx="6" fill="#f6ecee" stroke="#6b1d33" stroke-width="2.5"/>
<text x="820" y="334" font-size="26" font-weight="700" fill="#6b1d33" text-anchor="middle">Nakazawa Vineyard</text>
<text x="820" y="366" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">空知</tspan>(소라치)</text>
<text x="820" y="394" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">岩見沢</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">栗沢</tspan></text>
<text x="820" y="422" font-size="24" fill="#16191d" text-anchor="middle">(이와미자와 구리사와)</text>
<line x1="180" y1="450" x2="180" y2="514" stroke="#6b1d33" stroke-width="3" stroke-linecap="round"/>
<text x="196" y="500" font-size="24" font-weight="700" fill="#6b1d33">2년 연수 뒤 독립한 <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">余市</tspan>(요이치)의 도멘(일부)</text>
<rect x="30" y="514" width="178" height="116" rx="6" fill="#ffffff" stroke="#6b1d33" stroke-width="2.5"/>
<text x="119" y="550" font-size="24" font-weight="700" fill="#16191d" text-anchor="middle">Domaine Mon</text>
<text x="119" y="580" font-size="24" fill="#2b3036" text-anchor="middle">2016 독립</text>
<rect x="218" y="514" width="178" height="116" rx="6" fill="#ffffff" stroke="#6b1d33" stroke-width="2.5"/>
<text x="307" y="550" font-size="24" font-weight="700" fill="#16191d" text-anchor="middle">Atsushi</text>
<text x="307" y="580" font-size="24" font-weight="700" fill="#16191d" text-anchor="middle">Suzuki</text>
<rect x="406" y="514" width="178" height="116" rx="6" fill="#ffffff" stroke="#6b1d33" stroke-width="2.5"/>
<text x="495" y="550" font-size="24" font-weight="700" fill="#16191d" text-anchor="middle">LOWBROW</text>
<text x="495" y="580" font-size="24" fill="#2b3036" text-anchor="middle">2022</text>
<text x="495" y="610" font-size="24" fill="#2b3036" text-anchor="middle">연수 3년</text>
<rect x="594" y="514" width="178" height="116" rx="6" fill="#ffffff" stroke="#6b1d33" stroke-width="2.5"/>
<text x="683" y="550" font-size="24" font-weight="700" fill="#16191d" text-anchor="middle" lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">山田堂</text>
<text x="683" y="580" font-size="24" fill="#2b3036" text-anchor="middle">(야마다도)</text>
<text x="683" y="610" font-size="24" fill="#2b3036" text-anchor="middle">2021</text>
<rect x="782" y="514" width="178" height="116" rx="6" fill="#ffffff" stroke="#6b1d33" stroke-width="2.5"/>
<text x="871" y="550" font-size="24" font-weight="700" fill="#16191d" text-anchor="middle" lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">ランセッカ</text>
<text x="871" y="580" font-size="24" fill="#2b3036" text-anchor="middle">(란세카)</text>
<text x="871" y="610" font-size="24" fill="#2b3036" text-anchor="middle">2020</text>
<text x="30" y="676" font-size="24" fill="#2b3036"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">余市</tspan>(요이치) 이주자 다수가 Takahiko 에서 2년 연수(LOWBROW 는 3년).</text>
<text x="30" y="708" font-size="24" fill="#4a5058">Takahiko 창업은 2009 또는 2010(출처마다 다름). 연도는 출처에 있는 것만.</text>
</svg>
