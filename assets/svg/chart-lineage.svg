<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-labelledby="clin-t clin-d" font-family="'Noto Sans KR','Noto Sans JP',sans-serif" lang="ko">
<title id="clin-t">홋카이도 내추럴 와인의 계보</title>
<desc id="clin-d">홋카이도 내추럴 와인의 계보. Bruce Gutlove: 1989 栃木(도치기) ココ・ファーム(코코 팜) 초청으로 첫 방일, 1991 甲州(고슈)를 야생효모만으로 발효(무여과·무아황산), 2009 岩見沢(이와미자와) 이주, 2012 10R 설립(일본 첫 커스텀 크러시). サライ(사라이) 2018 이 꼽은 영향받은 생산자: Domaine Takahiko(曽我貴彦 소가 다카히코), KONDO, Nakazawa. Domaine Takahiko 에서 2년 연수 뒤 독립: Domaine Mon(2016), Atsushi Suzuki, LOWBROW(2022, 연수 3년), 山田堂(야마다도, 2021), ランセッカ(란세카, 2020).</desc>
<rect width="1000" height="720" fill="#ffffff"/>
<text x="30" y="40" font-size="28" font-weight="700" fill="#6b1d33">Bruce Gutlove(10R)</text>
<text x="330" y="40" font-size="24" fill="#2b3036">1961 <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">뉴욕</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">롱아일랜드</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">출생</tspan>, UC Davis <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">대학원</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">양조학</tspan></text>
<line x1="60" y1="98" x2="960" y2="98" stroke="#b9bec5" stroke-width="3" stroke-linecap="round"/>
<circle cx="110" cy="98" r="11" fill="#6b1d33" stroke="#fff" stroke-width="3"/>
<text x="110" y="76" font-size="28" font-weight="700" fill="#16191d" text-anchor="middle" font-family="'Noto Serif KR','Noto Serif JP',serif">1989</text>
<text x="110" y="140" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">栃木</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">도치기</tspan>)</text>
<text x="110" y="168" font-size="24" fill="#16191d" text-anchor="middle" lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">ココ・ファーム</text>
<text x="110" y="196" font-size="24" fill="#16191d" text-anchor="middle">(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">코코</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">팜</tspan>) <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">초청</tspan>,</text>
<text x="110" y="224" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">첫</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">방일</tspan></text>
<circle cx="350" cy="98" r="11" fill="#6b1d33" stroke="#fff" stroke-width="3"/>
<text x="350" y="76" font-size="28" font-weight="700" fill="#16191d" text-anchor="middle" font-family="'Noto Serif KR','Noto Serif JP',serif">1991</text>
<text x="350" y="140" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">甲州</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">고슈</tspan>)<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">를</tspan></text>
<text x="350" y="168" font-size="24" fill="#16191d" text-anchor="middle" lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">야생효모만으로</text>
<text x="350" y="196" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">발효</tspan>. <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">무여과</tspan>·</text>
<text x="350" y="224" font-size="24" fill="#16191d" text-anchor="middle" lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">무아황산</text>
<circle cx="600" cy="98" r="11" fill="#6b1d33" stroke="#fff" stroke-width="3"/>
<text x="600" y="76" font-size="28" font-weight="700" fill="#16191d" text-anchor="middle" font-family="'Noto Serif KR','Noto Serif JP',serif">2009</text>
<text x="600" y="140" font-size="24" fill="#16191d" text-anchor="middle" lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">岩見沢</text>
<text x="600" y="168" font-size="24" fill="#16191d" text-anchor="middle">(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">이와미자와</tspan>)<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">로</tspan></text>
<text x="600" y="196" font-size="24" fill="#16191d" text-anchor="middle" lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">이주</text>
<circle cx="850" cy="98" r="11" fill="#6b1d33" stroke="#fff" stroke-width="3"/>
<text x="850" y="76" font-size="28" font-weight="700" fill="#16191d" text-anchor="middle" font-family="'Noto Serif KR','Noto Serif JP',serif">2012</text>
<text x="850" y="140" font-size="24" fill="#16191d" text-anchor="middle">10R <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">설립</tspan>.</text>
<text x="850" y="168" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">일본</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">첫</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">커스텀</tspan></text>
<text x="850" y="196" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">크러시</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">위탁</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">양조</tspan>)</text>
