<text x="307" y="580" font-size="24" font-weight="700" fill="#16191d" text-anchor="middle">Suzuki</text>
<rect x="406" y="514" width="178" height="116" rx="6" fill="#ffffff" stroke="#6b1d33" stroke-width="2.5"/>
<text x="495" y="550" font-size="24" font-weight="700" fill="#16191d" text-anchor="middle">LOWBROW</text>
<text x="495" y="580" font-size="24" fill="#2b3036" text-anchor="middle">2022</text>
<text x="495" y="610" font-size="24" fill="#2b3036" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">연수</tspan> 3<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">년</tspan></text>
<rect x="594" y="514" width="178" height="116" rx="6" fill="#ffffff" stroke="#6b1d33" stroke-width="2.5"/>
