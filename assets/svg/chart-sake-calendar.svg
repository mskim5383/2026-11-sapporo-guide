<text x="282.6" y="66" font-size="24" font-weight="700" fill="#6b1d33" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">여행</tspan> 11/23~26</text>
<line x1="40" y1="660" x2="40" y2="670" stroke="#16191d" stroke-width="2.5" stroke-linecap="round"/>
<text x="40" y="694" font-size="24" font-weight="500" fill="#2b3036">11/1</text>
<line x1="343.3" y1="660" x2="343.3" y2="670" stroke="#16191d" stroke-width="2.5" stroke-linecap="round"/>
<text x="343.3" y="694" font-size="24" font-weight="500" fill="#2b3036" text-anchor="middle">12/1</text>
<line x1="656.7" y1="660" x2="656.7" y2="670" stroke="#16191d" stroke-width="2.5" stroke-linecap="round"/>
<text x="656.7" y="694" font-size="24" font-weight="500" fill="#2b3036" text-anchor="middle">1/1</text>
<line x1="960" y1="660" x2="960" y2="670" stroke="#16191d" stroke-width="2.5" stroke-linecap="round"/>
<text x="960" y="694" font-size="24" font-weight="500" fill="#2b3036" text-anchor="end">1/31</text>
<line x1="40" y1="660" x2="960" y2="660" stroke="#16191d" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="80.4" cy="136" r="7" fill="#16191d" stroke="#fff" stroke-width="2"/>
<text x="96.4" y="144" font-size="24" fill="#16191d" stroke="#ffffff" stroke-width="6.7" stroke-linejoin="round" paint-order="stroke">11/5 <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">国稀</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">구니마레</tspan>) <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">北海鬼ころし</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">原酒</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">홋카이</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">오니코로시</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">원주</tspan>) R40</text>
<circle cx="211.9" cy="180.2" r="7" fill="#16191d" stroke="#fff" stroke-width="2"/>
<text x="227.9" y="188.2" font-size="24" fill="#16191d" stroke="#ffffff" stroke-width="6.7" stroke-linejoin="round" paint-order="stroke">11/18 <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">国稀</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">純米大吟醸</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">구니마레</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">순미대음양</tspan>) 2,000<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">병</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">한정</tspan></text>
<circle cx="242.2" cy="224.3" r="7" fill="#16191d" stroke="#fff" stroke-width="2"/>
<text x="258.2" y="232.3" font-size="24" fill="#16191d" stroke="#ffffff" stroke-width="6.7" stroke-linejoin="round" paint-order="stroke">11/21 <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">男山</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">오토코야마</tspan>) <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">杉玉</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">스기다마</tspan>) <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">게시</tspan></text>
<rect x="245.3" y="261.5" width="24.1" height="14" rx="7" fill="#16191d"/>
<text x="278.4" y="276.5" font-size="24" fill="#16191d" stroke="#ffffff" stroke-width="6.7" stroke-linejoin="round" paint-order="stroke">11/22~23 <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">上川大雪</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">가미카와</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">다이세쓰</tspan>)</text>
<text x="278.4" y="320.7" font-size="24" fill="#2b3036" stroke="#ffffff" stroke-width="6.7" stroke-linejoin="round" paint-order="stroke">「<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">神川</tspan>」(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">가미카와</tspan>) <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">첫</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">짜기</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">무료</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">시음</tspan></text>
<circle cx="282.6" cy="356.8" r="7" fill="#16191d" stroke="#fff" stroke-width="2"/>
<text x="298.6" y="364.8" font-size="24" fill="#16191d" stroke="#ffffff" stroke-width="6.7" stroke-linejoin="round" paint-order="stroke">11/25 <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">上川大雪</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">터널</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">숙성</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">발매</tspan></text>
<circle cx="292.7" cy="401" r="7" fill="#16191d" stroke="#fff" stroke-width="2"/>
<text x="308.7" y="409" font-size="24" fill="#16191d" stroke="#ffffff" stroke-width="6.7" stroke-linejoin="round" paint-order="stroke">11/26 <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">田中酒造</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">다나카</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">주조</tspan>) <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">간지</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">술</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">병입</tspan></text>
<circle cx="343.3" cy="445.2" r="7" fill="#16191d" stroke="#fff" stroke-width="2"/>
<text x="359.3" y="453.2" font-size="24" fill="#16191d" stroke="#ffffff" stroke-width="6.7" stroke-linejoin="round" paint-order="stroke">12/1 <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">五稜</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">고료</tspan>) <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">新米新酒</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">生</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">신미신주</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">생</tspan>)</text>
<circle cx="363.5" cy="489.3" r="7" fill="#16191d" stroke="#fff" stroke-width="2"/>
<text x="379.5" y="497.3" font-size="24" fill="#16191d" stroke="#ffffff" stroke-width="6.7" stroke-linejoin="round" paint-order="stroke">12/3 <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">北の勝</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">大吟醸</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">기타노카쓰</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">대음양</tspan>)</text>
<circle cx="434.3" cy="533.5" r="7" fill="#16191d" stroke="#fff" stroke-width="2"/>
<text x="450.3" y="541.5" font-size="24" fill="#16191d" stroke="#ffffff" stroke-width="6.7" stroke-linejoin="round" paint-order="stroke">12/10 <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">金滴</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">긴테키</tspan>) <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">初醸</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">하쓰카모</tspan>)</text>
<circle cx="434.3" cy="577.7" r="7" fill="#16191d" stroke="#fff" stroke-width="2"/>
<text x="450.3" y="585.7" font-size="24" fill="#16191d" stroke="#ffffff" stroke-width="6.7" stroke-linejoin="round" paint-order="stroke">12/10~ <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">二世古</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">니세코</tspan>) <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">えぞの誉</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">에조노호마레</tspan>)</text>
<circle cx="848.8" cy="621.8" r="7" fill="#16191d" stroke="#fff" stroke-width="2"/>
<text x="832.8" y="629.8" font-size="24" fill="#16191d" text-anchor="end" stroke="#ffffff" stroke-width="6.7" stroke-linejoin="round" paint-order="stroke">1/20 <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">北の勝</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">搾りたて</tspan></text>
<text x="832.8" y="655.8" font-size="24" fill="#2b3036" text-anchor="end" stroke="#ffffff" stroke-width="6.7" stroke-linejoin="round" paint-order="stroke">(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">기타노카쓰</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">시보리타테</tspan>)</text>
<text x="30" y="748" font-size="24" fill="#4a5058">2025<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">년</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">같은</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">시기의</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">출하</tspan>·<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">행사</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">北海道新聞</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">홋카이도</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">신문</tspan>) <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">보도</tspan>). 2026<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">년은</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">바뀔</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">수</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">있다</tspan>.</text>
