<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="csc-t csc-d" font-family="'Noto Sans KR','Noto Sans JP',sans-serif" lang="ko">
<title id="csc-t">11월 말의 새 술</title>
<desc id="csc-d">11월 말 홋카이도 새 술 캘린더(2025년 실적, 2026년은 추정). 11/5 国稀(구니마레) 北海鬼ころし 原酒(홋카이 오니코로시 원주) R40, 11/18 国稀 純米大吟醸(구니마레 순미대음양) 2,000병 한정, 11/21 男山(오토코야마) 杉玉(스기다마) 게시, 11/22~23 上川大雪(가미카와 다이세쓰) 「神川」(가미카와) 첫 짜기 무료 시음, 11/25 上川大雪 터널 숙성, 11/26 田中酒造(다나카 주조) 간지 술 병입, 12/1 五稜(고료) 新米新酒 生, 12/3 北の勝 大吟醸(기타노카쓰 대음양), 12/10 金滴(긴테키) 初醸(하쓰카모), 12/10~ 二世古(니세코) えぞの誉(에조노호마레), 1/20 北の勝 搾りたて(기타노카쓰 시보리타테). 여행 11/23~26. 구간: 만날 가능성(11월 말까지), 1~2주 늦음(12월 초~중순), 못 만남(1월).</desc>
<rect width="1000" height="760" fill="#ffffff"/>
<text x="30" y="36" font-size="28" font-weight="700" fill="#1f4a3f">11<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">월</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">말의</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">새</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">술</tspan> · 2025<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">년</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">실적</tspan>, 2026<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">년은</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">추정</tspan></text>
<rect x="40" y="110" width="262.9" height="550" fill="#e8f0ec"/>
<text x="171.4" y="98" font-size="24" font-weight="700" fill="#1f4a3f" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">만날</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">가능성</tspan></text>
<rect x="302.9" y="110" width="171.9" height="550" fill="#f7f2e6"/>
<text x="388.8" y="98" font-size="24" font-weight="700" fill="#7a5300" text-anchor="middle">1~2<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">주</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">늦음</tspan></text>
<rect x="474.7" y="110" width="485.3" height="550" fill="#fbeceb"/>
<text x="717.4" y="98" font-size="24" font-weight="700" fill="#b3261e" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">못</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">만남</tspan></text>
