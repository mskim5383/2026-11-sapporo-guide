<text x="535" y="598" font-size="24" fill="#2b3036">2025-03 「<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">北海道産</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">北冴</tspan>」</text>
