<text x="970" y="110" font-size="24" font-weight="700" fill="#b3261e" text-anchor="end">32kg <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">상한</tspan></text>
<line x1="40" y1="468" x2="480" y2="468" stroke="#2b3036" stroke-width="2.5" stroke-linecap="round"/>
<line x1="520" y1="468" x2="960" y2="468" stroke="#2b3036" stroke-width="2.5" stroke-linecap="round"/>
<text x="30" y="560" font-size="24" fill="#4a5058"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">무게</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">목표는</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">가방</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">하나씩</tspan>. <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">박스</tspan> 2<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">개를</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">다</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">술에</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">써도</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">술</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">약</tspan> 30kg <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">안팎이</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">현실적</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">한계</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">추정</tspan>).</text>
