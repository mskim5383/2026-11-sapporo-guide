<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-labelledby="cbg-t cbg-d" font-family="'Noto Sans KR','Noto Sans JP',sans-serif" lang="ko">
<title id="cbg-t">위탁 수하물 배분</title>
<desc id="cbg-d">위탁 수하물 배분(B안). 프레스티지 1인 2개, 각 32kg 이하, 가방·사람끼리 합산 불가. 사람 1: 캐리어 1(옷 + 와인 4병, 프로텍터, 30kg 이하), 박스 1(6병용 와인 쉬퍼, 와인 6병, 약 9~10kg). 사람 2: 캐리어 2(옷 + 아기용품 + 사케 720ml 3병, 30kg 이하), 박스 2(일승병 1 + 남는 병 또는 아기용품 큰 상자, 32kg 이하). B안 술만 약 19.6kg(추정).</desc>
<rect width="1000" height="580" fill="#ffffff"/>
<text x="30" y="38" font-size="28" font-weight="700" fill="#16191d"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">위탁</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">수하물</tspan> · <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">프레스티지</tspan> 1<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">인</tspan> 2<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">개</tspan>, <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">각</tspan> 32kg <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">이하</tspan></text>
<text x="30" y="72" font-size="24" font-weight="700" fill="#b3261e"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">가방끼리</tspan>·<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">사람끼리</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">무게를</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">나눠</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">쓸</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">수</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">없다</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">합산</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">불가</tspan>). B<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">안</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">기준</tspan>, <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">술만</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">약</tspan> 19.6kg(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">추정</tspan>).</text>
<rect x="40" y="120" width="200" height="260" rx="8" fill="#ffffff" stroke="#16191d" stroke-width="3"/>
<rect x="43" y="136.2" width="194" height="240.8" rx="5" fill="#f6ecee"/>
<line x1="40" y1="136.2" x2="240" y2="136.2" stroke="#6b1d33" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
<text x="140" y="166.2" font-size="24" font-weight="700" fill="#6b1d33" text-anchor="middle" stroke="#ffffff" stroke-width="6.7" stroke-linejoin="round" paint-order="stroke">30kg <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">이하</tspan></text>
<text x="140" y="288" font-size="24" fill="#16191d" text-anchor="middle" lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">옷</text>
<text x="140" y="316" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">와인</tspan> 4<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">병</tspan></text>
<text x="140" y="344" font-size="24" fill="#16191d" text-anchor="middle">(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">프로텍터</tspan>)</text>
<text x="140" y="416" font-size="26" font-weight="700" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">캐리어</tspan> 1</text>
<text x="140" y="446" font-size="24" fill="#2b3036" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">사람</tspan> 1</text>
