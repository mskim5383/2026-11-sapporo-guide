<text x="620" y="166.2" font-size="24" font-weight="700" fill="#6b1d33" text-anchor="middle" stroke="#ffffff" stroke-width="6.7" stroke-linejoin="round" paint-order="stroke">30kg <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">이하</tspan></text>
<text x="620" y="288" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">옷</tspan> · <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">아기용품</tspan></text>
<text x="620" y="316" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">사케</tspan> 720ml</text>
<text x="620" y="344" font-size="24" fill="#16191d" text-anchor="middle">3<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">병</tspan></text>
<text x="620" y="416" font-size="26" font-weight="700" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">캐리어</tspan> 2</text>
<text x="620" y="446" font-size="24" fill="#2b3036" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">사람</tspan> 2</text>
<rect x="760" y="120" width="200" height="260" rx="8" fill="#ffffff" stroke="#16191d" stroke-width="3"/>
