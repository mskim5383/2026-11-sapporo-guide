<line x1="760" y1="120" x2="960" y2="120" stroke="#6b1d33" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
<text x="860" y="150" font-size="24" font-weight="700" fill="#6b1d33" text-anchor="middle" stroke="#ffffff" stroke-width="6.7" stroke-linejoin="round" paint-order="stroke">32kg <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">이하</tspan></text>
<text x="860" y="288" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">일승병</tspan> 1 +</text>
<text x="860" y="316" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">남는</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">병</tspan>, <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">또는</tspan></text>
<text x="860" y="344" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">아기용품</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">큰</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">상자</tspan></text>
