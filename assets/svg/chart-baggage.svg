<rect x="283" y="298.8" width="194" height="78.2" rx="5" fill="#f6ecee"/>
<line x1="280" y1="298.8" x2="480" y2="298.8" stroke="#6b1d33" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
<text x="380" y="288.8" font-size="24" font-weight="700" fill="#6b1d33" text-anchor="middle" stroke="#ffffff" stroke-width="6.7" stroke-linejoin="round" paint-order="stroke"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">약</tspan> 9~10kg</text>
<text x="380" y="180" font-size="24" fill="#16191d" text-anchor="middle">6<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">병용</tspan></text>
<text x="380" y="208" font-size="24" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">와인</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">쉬퍼</tspan></text>
<text x="380" y="236" font-size="24" fill="#16191d" text-anchor="middle">(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">와인</tspan> 6<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">병</tspan>)</text>
<text x="380" y="416" font-size="26" font-weight="700" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">박스</tspan> 1</text>
<text x="380" y="446" font-size="24" fill="#2b3036" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">사람</tspan> 1</text>
