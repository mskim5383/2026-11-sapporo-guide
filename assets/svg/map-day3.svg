<title id="md3-t">11/25 라멘에서 칵테일까지</title>
<desc id="md3-d">11/25 동선 개념도(북쪽을 크게 줄임). 10:20 지하철 大通(오도리) → 北24条(기타니주욘조) 약 7분, 10:45 ① 麺 鍾馗 本店(멘 쇼키 본점, 北26東1) 줄, 11:00 개점. 11:50 택시 약 15분(또는 지하철 + JR 苗穂(나에보)) → 12:20 ② アリオ札幌(아리오 삿포로) 2층 アカチャンホンポ(아카찬혼포), 13:30 ③ サッポロビール博物館(삿포로 비루 박물관, 아리오 옆, 추정) 가이드투어, 14:50 아카찬혼포 구매. 15:35 택시 → 15:50 숙소 由縁 札幌(유엔 삿포로). 17:00 ④ 鷄灯(게이토, 南1東2) → 19:35 ⑤ the bar nano.femto.(南3西3).</desc>
