<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="cdf-t cdf-d" font-family="'Noto Sans KR','Noto Sans JP',sans-serif" lang="ko">
<title id="cdf-t">자진신고 흐름</title>
<desc id="cdf-d">술 자진신고 흐름. 1 가게에서: 영수증 가게별·사람별, 마실 술은 따로 계산, 병마다 무엇을 얼마에. 2 11/26 신치토세: 면세품은 키오스크 먼저, 그다음 체크인·위탁. 3 기내·도착 직후: 모바일 자진신고 작성(또는 종이 신고서). 4 인천: 수하물 → 신고 통로 → 영수증·병 확인 → 모바일 고지서 납부. 신고하지 않고 걸리면 가산세 40%, 2년 안 2회 이상이면 60%. 자진신고는 관세 30% 경감.</desc>
<rect width="1000" height="620" fill="#ffffff"/>
<text x="30" y="38" font-size="28" font-weight="700" fill="#6b1d33"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">영수증부터</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">납부까지</tspan></text>
<rect x="30" y="70" width="300" height="220" rx="6" fill="#ffffff" stroke="#6b1d33" stroke-width="2.5"/>
<text x="48" y="108" font-size="26" font-weight="700" fill="#6b1d33">1 <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">가게에서</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">일본</tspan>)</text>
<text x="48" y="146" font-size="24" fill="#16191d"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">영수증은</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">가게별</tspan>·</text>
<text x="48" y="176" font-size="24" fill="#16191d"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">사람별로</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">보관</tspan></text>
<text x="48" y="206" font-size="24" fill="#16191d"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">마실</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">술은</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">따로</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">계산</tspan></text>
<text x="48" y="236" font-size="24" fill="#16191d"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">병마다</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">무엇을</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">얼마에</tspan></text>
<rect x="350" y="70" width="300" height="220" rx="6" fill="#ffffff" stroke="#6b1d33" stroke-width="2.5"/>
<text x="368" y="108" font-size="26" font-weight="700" fill="#6b1d33">2 11/26 <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">신치토세</tspan></text>
<text x="368" y="146" font-size="24" fill="#16191d"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">면세품은</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">키오스크</tspan></text>
<text x="368" y="176" font-size="24" fill="#16191d"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">먼저</tspan>, <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">그다음</tspan></text>
<text x="368" y="206" font-size="24" fill="#16191d"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">체크인</tspan>·<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">위탁</tspan></text>
<rect x="670" y="70" width="300" height="220" rx="6" fill="#ffffff" stroke="#6b1d33" stroke-width="2.5"/>
<text x="688" y="108" font-size="26" font-weight="700" fill="#6b1d33">3 <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">기내</tspan>·<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">도착</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">직후</tspan></text>
<text x="688" y="146" font-size="24" fill="#16191d"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">모바일</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">자진신고</tspan></text>
<text x="688" y="176" font-size="24" fill="#16191d"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">작성</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">또는</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">종이</tspan></text>
<text x="688" y="206" font-size="24" fill="#16191d"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">신고서</tspan>)</text>
<line x1="324" y1="180" x2="346" y2="180" stroke="#6b1d33" stroke-width="4" stroke-linecap="round"/><path d="M346 180 L332 172.3 L332 187.7 Z" fill="#6b1d33"/>
<line x1="644" y1="180" x2="666" y2="180" stroke="#6b1d33" stroke-width="4" stroke-linecap="round"/><path d="M666 180 L652 172.3 L652 187.7 Z" fill="#6b1d33"/>
<line x1="820" y1="290" x2="820" y2="330" stroke="#6b1d33" stroke-width="4" stroke-linecap="round"/><path d="M820 330 L827.7 316 L812.3 316 Z" fill="#6b1d33"/>
<text x="30" y="370" font-size="26" font-weight="700" fill="#6b1d33">4 <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">인천</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">도착</tspan></text>
<rect x="30" y="390" width="190" height="70" rx="6" fill="#f6ecee" stroke="#6b1d33" stroke-width="2.5"/>
<text x="125" y="434" font-size="24" font-weight="700" fill="#16191d" text-anchor="middle" lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">수하물</text>
<line x1="224" y1="425" x2="244" y2="425" stroke="#6b1d33" stroke-width="4" stroke-linecap="round"/><path d="M244 425 L232 418.4 L232 431.6 Z" fill="#6b1d33"/>
<rect x="250" y="390" width="190" height="70" rx="6" fill="#6b1d33" stroke="#6b1d33" stroke-width="2.5"/>
<text x="345" y="434" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">「<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">신고</tspan>」 <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">통로</tspan></text>
<line x1="444" y1="425" x2="464" y2="425" stroke="#6b1d33" stroke-width="4" stroke-linecap="round"/><path d="M464 425 L452 418.4 L452 431.6 Z" fill="#6b1d33"/>
<rect x="470" y="390" width="220" height="70" rx="6" fill="#f6ecee" stroke="#6b1d33" stroke-width="2.5"/>
<text x="580" y="434" font-size="24" font-weight="700" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">영수증</tspan>·<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">병</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">확인</tspan></text>
<line x1="694" y1="425" x2="714" y2="425" stroke="#6b1d33" stroke-width="4" stroke-linecap="round"/><path d="M714 425 L702 418.4 L702 431.6 Z" fill="#6b1d33"/>
<rect x="720" y="390" width="250" height="70" rx="6" fill="#f6ecee" stroke="#6b1d33" stroke-width="2.5"/>
<text x="845" y="434" font-size="24" font-weight="700" fill="#16191d" text-anchor="middle"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">모바일</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">고지서</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">납부</tspan></text>
<text x="30" y="500" font-size="24" fill="#2b3036">「<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">신고없음</tspan>」 <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">통로가</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">아니다</tspan>. 30~60<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">분</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">더</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">잡는다</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">추정</tspan>).</text>
<rect x="30" y="540" width="940" height="64" rx="6" fill="#fbeceb" stroke="#b3261e" stroke-width="2.5"/>
<text x="50" y="581" font-size="24" font-weight="700" fill="#b3261e"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">신고하지</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">않고</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">걸리면</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">가산세</tspan> 40%, 2<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">년</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">안</tspan> 2<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">회</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">이상이면</tspan> 60%. <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">자진신고는</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">관세</tspan> 30% <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">경감</tspan>.</text>
</svg>
