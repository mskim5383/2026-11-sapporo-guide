<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="ctp-t ctp-d" font-family="'Noto Sans KR','Noto Sans JP',sans-serif" lang="ko">
<title id="ctp-t">Nana-Tsu-Mori 가격</title>
<desc id="ctp-d">Domaine Takahiko Nana-Tsu-Mori Pinot Noir 가격 변화. 2017년 일본 소매 3,700엔, 2026년 2024 빈티지 68,500엔(Bottles Japan, 2차 시장). 해외: 미국 리테일 US$210, K&amp;L 경매 2022 빈티지 입찰 US$410. 2차 시장·해외 리테일 가격이다.</desc>
<rect width="1000" height="460" fill="#ffffff"/>
<text x="30" y="40" font-size="28" font-weight="700" fill="#6b1d33">Nana-Tsu-Mori Pinot Noir <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">한</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">병</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">가격</tspan></text>
<text x="230" y="124" font-size="28" font-weight="700" fill="#16191d" text-anchor="end" font-family="'Noto Serif KR','Noto Serif JP',serif">2017<tspan lang="ja" font-family="'Noto Serif JP','Noto Serif KR',serif">년</tspan></text>
<text x="230" y="156" font-size="24" fill="#2b3036" text-anchor="end"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">일본</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">소매</tspan></text>
<rect x="250" y="96" width="34.6" height="64" fill="#f6ecee" stroke="#6b1d33" stroke-width="2.5"/>
<text x="298.6" y="138" font-size="30" font-weight="700" fill="#16191d">3,700<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">엔</tspan></text>
<text x="230" y="234" font-size="28" font-weight="700" fill="#16191d" text-anchor="end" font-family="'Noto Serif KR','Noto Serif JP',serif">2026<tspan lang="ja" font-family="'Noto Serif JP','Noto Serif KR',serif">년</tspan></text>
<text x="230" y="266" font-size="24" fill="#2b3036" text-anchor="end">2024 <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">빈티지</tspan></text>
<rect x="250" y="206" width="640" height="64" fill="#6b1d33" stroke="#6b1d33" stroke-width="2.5"/>
<text x="876" y="248" font-size="30" font-weight="700" fill="#ffffff" text-anchor="end">68,500<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">엔</tspan></text>
<text x="250" y="362" font-size="24" fill="#2b3036">2026<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">년</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">값</tspan>: Bottles Japan(2<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">차</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">시장</tspan>). <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">해외</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">리테일은</tspan></text>
<text x="250" y="392" font-size="24" font-weight="700" fill="#16191d"><tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">미국</tspan> US$210, K&amp;L <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">경매</tspan> 2022 <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">빈티지</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">입찰가</tspan> US$410</text>
<text x="250" y="432" font-size="24" fill="#4a5058">2<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">차</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">시장</tspan>·<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">해외</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">리테일</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">가격이다</tspan>(<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">검색</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">요약</tspan>, 2<tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">차</tspan>). <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">일본</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">정가가</tspan> <tspan lang="ja" font-family="'Noto Sans JP','Noto Sans KR',sans-serif">아니다</tspan>.</text>
<line x1="250" y1="80" x2="250" y2="316" stroke="#16191d" stroke-width="2.5" stroke-linecap="round"/>
</svg>
