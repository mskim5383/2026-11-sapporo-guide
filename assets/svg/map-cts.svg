<text x="540" y="494" font-size="24" font-weight="700" fill="#6b1d33">1</text><text x="564" y="494" font-size="24" fill="#16191d">면세 키오스크(체크인 전)</text><text x="540" y="524" font-size="24" font-weight="700" fill="#6b1d33">2</text><text x="564" y="524" font-size="24" fill="#16191d">대한항공 체크인·위탁</text><text x="540" y="554" font-size="24" font-weight="700" fill="#6b1d33">3</text><text x="564" y="554" font-size="24" fill="#16191d">보안검사·출국심사</text><text x="540" y="584" font-size="24" font-weight="700" fill="#6b1d33">4</text><text x="564" y="584" font-size="24" fill="#16191d">4F 로열 라운지(69번 맞은편)</text><text x="540" y="614" font-size="24" font-weight="700" fill="#6b1d33">5</text><text x="564" y="614" font-size="24" fill="#16191d">탑승구(최근 66·67번)</text>
