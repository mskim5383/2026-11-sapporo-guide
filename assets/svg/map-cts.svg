<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="mcts-t mcts-d" font-family="'Noto Sans KR','Noto Sans JP',sans-serif" lang="ko">
<title id="mcts-t">신치토세 공항 귀국 순서</title>
<desc id="mcts-d">新千歳空港(신치토세 공항) 귀국 동선 개념 단면. 국내선 터미널 지하의 JR 新千歳空港駅(신치토세 공항역)에서 올라와 2층 연결 시설로 국제선 터미널에 건너간다(약 15분, 추정). 3층 통로는 2026-09-02부터 2027-06말까지 공사로 닫혀 있다. 국제선 3층 출발 로비에서 ① 면세 키오스크(체크인·위탁 전) → ② 대한항공 체크인·위탁 → ③ 보안검사·출국심사 → ④ 4층 로열 라운지(69번 탑승구 맞은편) → ⑤ 탑승구(최근 66·67번). 택시 승차장은 국제선 1층. 층·위치는 개념.</desc>
