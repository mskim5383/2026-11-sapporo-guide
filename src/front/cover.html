<!-- 표지(1쪽). 마스트헤드 NAGOYA + 커버 라인 6개(BRIEF 1장 그대로) + 제목·부제·시리즈·날짜.
     사진(cover-castle)이 없으면 빌드가 figure 를 빼고, CSS(:has)가 金鯱 대체 그래픽을 보여 준다.
     사진 위에는 글자를 얹지 않는다(판 나눔). 세로 키커만 사진 오른쪽 위 흰 띠 위에 둔다.
     일본어 옆에는 매번 한글 소리(발행인 지시 2026-11-08): 제호 아래 名古屋(나고야), 키커, 커버 라인의 大甚(다이진). -->

  <div class="cover-body">
    <div class="cover-titles">
      <p class="cover-title">성 아래<br>닷새</p>

      <li><span class="cl-k">특집</span>성 아래 마을, 나고야</li>

      <li>진열대에서 고르는 백 년 이자카야 <span lang="ja">大甚</span>(다이진)</li>
      <li>가금류 알러지, 누가 무엇을 먹을 수 있나</li>
      <li>보여 주기만 하면 되는 일본어 카드</li>
      <li>새 면세 환급, 공항에서 할 순서</li>
    </ol>
  </div>

  <nav class="web-toc web-only" aria-label="차례">
